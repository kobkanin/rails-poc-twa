<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rails POC (Static PWA)</title>

    <!-- PWA -->
    <meta name="theme-color" content="#0ea5e9" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />

    <meta
      name="description"
      content="Rails POC on GitHub Pages as a Static PWA"
    />

    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu,
          Helvetica, Arial, sans-serif;
        margin: 0;
        background: #f6f8fa;
      }
      .wrap {
        max-width: 820px;
        margin: 40px auto;
        padding: 24px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      }
      .badge {
        display: inline-block;
        background: #e6f4ff;
        color: #055;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
      }
      .row {
        display: flex;
        gap: 16px;
        align-items: center;
      }
      img.icon {
        width: 64px;
        height: 64px;
      }
      a.btn,
      button.btn {
        display: inline-block;
        margin-top: 12px;
        padding: 10px 14px;
        border-radius: 8px;
        background: #0ea5e9;
        color: #fff;
        text-decoration: none;
        border: none;
        cursor: pointer;
      }
      code {
        background: #f3f3f3;
        padding: 2px 6px;
        border-radius: 6px;
      }
      .token-box {
        margin-top: 12px;
        padding: 12px;
        border: 1px dashed #cbd5e1;
        border-radius: 8px;
        background: #f8fafc;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", "Courier New", monospace;
        word-break: break-all;
      }
      .token-actions {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .muted {
        color: #64748b;
        font-size: 12px;
      }
    </style>
  </head>

  <body>
    <div class="wrap">
      <span class="badge">Static PWA on GitHub Pages</span>
      <h1>Rails POC — Static Frontend</h1>

      <div class="row">
        <img class="icon" src="./icon-192.png" alt="icon" />
        <p>
          หน้านี้รันบน GitHub Pages (สแตติก) — ถ้าต้องการ Rails backend จริง
          ให้โฮสต์ที่ Render/Fly/ฯลฯ แล้วเรียก API จากหน้าเว็บนี้
        </p>
      </div>

      <a class="btn" href="./" rel="noopener">Reload</a>
      <p>Basepath ของเว็บนี้คือ <code id="basepath">/</code> (auto detect)</p>

      <h2>FCM</h2>
      <button id="btnToken" class="btn">Show FCM Token</button>
      <div id="tokenBox" class="token-box" hidden>
        <div class="muted">FCM Token:</div>
        <div id="tokenText">-</div>
        <div class="token-actions">
          <button id="btnCopy" class="btn" style="background: #16a34a">
            Copy
          </button>
          <button id="btnHide" class="btn" style="background: #475569">
            Hide
          </button>
        </div>
      </div>
    </div>

    <!-- === Firebase (Modular SDK) === -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
      import {
        getMessaging,
        getToken,
        onMessage,
        isSupported,
      } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-messaging.js";

      // คำนวณ basePath สำหรับ GitHub Pages (repo page)
      const parts = location.pathname.split("/").filter(Boolean);
      const basePath = parts.length ? `/${parts[0]}/` : "/";
      document.getElementById("basepath").textContent = basePath;

      // ลงทะเบียน App Service Worker (แคช + Offline)
      (async function registerAppSW() {
        if (!("serviceWorker" in navigator)) return;
        const swUrl = `${basePath}sw.js?v=${Date.now()}`;
        try {
          const reg = await navigator.serviceWorker.register(swUrl, {
            scope: basePath,
          });
          await navigator.serviceWorker.ready;
          console.log("[AppSW] registered:", reg.scope);
        } catch (e) {
          console.warn("[AppSW] register failed:", e);
        }
      })();

      // Firebase Config ของคุณหนูกบ
      const app = initializeApp({
        apiKey: "AIzaSyBEYRc3lWgrhf3JuzBVOI33sdelL53xuuk",
        authDomain: "onerev-dev.firebaseapp.com",
        projectId: "onerev-dev",
        messagingSenderId: "782528078431",
        appId: "1:782528078431:web:ccd3e92370c8e316c531ea",
      });

      let messaging;
      (async () => {
        if (await isSupported()) {
          messaging = getMessaging(app);
        } else {
          console.warn("Firebase Messaging ไม่รองรับบนเบราว์เซอร์นี้");
        }
      })();

      async function ensurePermission() {
        if (!("Notification" in window))
          throw new Error("Browser ไม่รองรับ Notification API");
        let p = Notification.permission;
        if (p === "default") p = await Notification.requestPermission();
        if (p !== "granted")
          throw new Error("ยังไม่ได้ให้สิทธิ์แจ้งเตือน (" + p + ")");
      }

      async function registerFcmSW() {
        const secure =
          location.protocol === "https:" ||
          ["localhost", "127.0.0.1"].includes(location.hostname);
        if (!secure) throw new Error("ต้องรันผ่าน HTTPS หรือ localhost");

        const reg = await navigator.serviceWorker.register(
          `${basePath}firebase-messaging-sw.js?v=${Date.now()}`,
          { scope: basePath }
        );
        await navigator.serviceWorker.ready;
        console.log("[FCMSW] registered:", reg.scope);
        return reg;
      }

      async function getFcmTokenWith(registration) {
        const vapidKey =
          "BFCv-L3AhpTkUvrUyGYLHpSv-CnSI0Nla7XaafAU4TqyXXfCZJrtrzScBMhFFfjryDZsPg0Ew8qKywXfLt_bYIg";
        const token = await getToken(messaging, {
          vapidKey,
          serviceWorkerRegistration: registration,
        });
        if (!token)
          throw new Error("ไม่ได้รับ token (ตรวจ VAPID key / permission / SW)");
        return token;
      }

      // รับข้อความขณะ foreground
      (function fgMessage() {
        if (!messaging) return;
        onMessage(messaging, (payload) => {
          console.log("Foreground message:", payload);
          const { title, body } = payload.notification || {};
          if (title || body) new Notification(title || "Message", { body });
        });
      })();

      // ปุ่มแสดง Token
      (function wireButton() {
        const btn = document.getElementById("btnToken");
        const box = document.getElementById("tokenBox");
        const text = document.getElementById("tokenText");
        const btnCopy = document.getElementById("btnCopy");
        const btnHide = document.getElementById("btnHide");

        btn.addEventListener("click", async () => {
          try {
            btn.disabled = true;
            btn.textContent = "Loading...";
            await ensurePermission();
            const reg = await registerFcmSW();
            const token = await getFcmTokenWith(reg);
            console.log("✅ FCM Token:", token);
            text.textContent = token;
            box.hidden = false;
          } catch (e) {
            console.error("❌ Get token failed:", e);
            alert("Get token failed: " + e.message);
          } finally {
            btn.disabled = false;
            btn.textContent = "Show FCM Token";
          }
        });

        btnCopy.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(text.textContent.trim());
            btnCopy.textContent = "Copied!";
            setTimeout(() => (btnCopy.textContent = "Copy"), 1200);
          } catch {
            alert("คัดลอกไม่สำเร็จ");
          }
        });

        btnHide.addEventListener("click", () => (box.hidden = true));
      })();

      // Debug ด้วย eruda
      import("https://cdn.jsdelivr.net/npm/eruda").then((m) =>
        m.default.init()
      );
    </script>
  </body>
</html>
